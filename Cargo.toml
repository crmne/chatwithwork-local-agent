[package]
name = "cww"
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
description = "Chat with Work Local Agent: shares folders you choose with Chat with Work through MCP tools, read-only unless you allow changes"
license = "MIT OR Apache-2.0"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/chatwithwork-local-agent"
homepage = "https://chatwithwork.com"
readme = "README.md"
keywords = ["mcp", "search", "files", "agent"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[workspace]
# The desktop app lives in app/. It links this crate's control client and
# paths, and talks to the daemon over the control channel (CONTROL.md).
members = [".", "app"]

[lib]
name = "cww"
path = "src/lib.rs"

[[bin]]
name = "cww"
path = "src/main.rs"

# The daemon without a console window, for the Windows logon task.
[[bin]]
name = "cww-agent"
path = "src/agent.rs"

[dependencies]
# Runtime, CLI, serialization
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# MCP server core (official SDK). Only the server role; we bring our own transport.
rmcp = { version = "3.4.1", default-features = false, features = ["server"] }

# Network: WebSocket tunnel and the pairing/token HTTP calls, rustls + ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Trust the OS certificate store (private CAs, corporate proxies, local
# development CAs) plus Mozilla's roots as a fallback.
rustls-native-certs = "0.8"
webpki-root-certs = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
url = "2.5"
percent-encoding = "2.3"
# TLS to an https:// proxy; tokio-tungstenite already uses it for the server.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Crypto: Ed25519 device key, SHA-256 and randomness come from ring (already used by rustls).
ring = "0.17"
base64 = "0.22"

# Secrets: OS keychain (macOS Keychain, Secret Service), with a 0600 file fallback.
keyring = "4.2"

# Files: walking, grep, index, watching. Safe resolution is per platform below.
ignore = "0.4.33"
globset = "0.4.20"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
# Deny patterns and paths are compared case-folded and in NFD, as the
# case-insensitive filesystems compare names (lopdf already brings it).
unicode-normalization = "0.1.25"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
notify = "8.2"

# Extraction: pdf, xlsx, docx/pptx (zip + xml). Only pure-Rust codecs.
lopdf = { version = "0.45", default-features = false }
calamine = "0.36"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

# Diffs of text changes for the approval preview (dry runs). No dependencies.
similar = "3.2"

# Documents `create_document` writes: Word from Markdown, Excel from rows.
# Both write through the zip and quick-xml above; no images, no macros.
docx-rs = { version = "0.4.22", default-features = false }
rust_xlsxwriter = { version = "0.99", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }

# One allocator everywhere that hands freed memory back to the system:
# glibc, musl and the macOS allocator all kept hundreds of megabytes after
# indexing a large folder.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }

# The user's Documents folder (XDG user dirs, known folders on Windows).
dirs = "6"

# Terminal UI (`cww tui`). crossterm works the same on Linux, macOS and Windows.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.29"

# Safe resolution (openat2, O_NOFOLLOW, F_GETPATH), peer credentials, umask.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "system", "alloc"] }

# The kernel sandbox for the daemon on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Handle-based resolution, the named pipe's DACL and peer checks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# crmne/egui apps-0.36, shared with ZapFast, Spotifast, RekordFlash and
# TonePush: egui 0.36.1 plus eframe pacing Wayland frames by the compositor's
# frame callbacks, so a settings window Hyprland stops showing (covered by a
# fullscreen window, on a hidden workspace, or with the display off) never
# blocks the event loop, and with it the tray, in a vsync swap
# (emilk/egui#8631); egui-winit using winit's Wayland clipboard; each
# emoji cluster laid out one emoji wide; invisible widgets hidden from
# accessibility, so a focus request for one not drawn yet can't panic
# AccessKit; a compatibility-profile OpenGL fallback for old drivers; and
# the window's size restored at any zoom. Every egui crate comes from the same revision so they
# share one emath and epaint. Drop this once egui releases the fix.
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_kittest = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
# crmne/winit apps-0.30: winit 0.30.13 plus Wayland `Occluded` for the
# xdg-shell suspended state (rust-windowing/winit#4709, #4710), which the
# eframe above uses, files dropped on a window and the clipboard through one
# Wayland data device, the mixed-DPI resize fix, and a dropped macOS window
# ordered out before it closes. Moves with the egui
# revision above: winit alone would take Hyprland's selection from egui.
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
