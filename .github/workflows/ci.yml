name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold mbx cache is slow; a job cut off before the cache saves stays
    # cold on every later run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain, so the cache key follows the pinned rustc. The
      # key carries no job name, so each job sets its own generation.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      - run: cargo fmt --check
      - run: mbx clippy --all-targets --locked -- -D warnings
      - run: mbx test --locked --no-run
      - run: mbx test --locked
        timeout-minutes: 5

  # The desktop app, on the three platforms it runs on.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # An uncached release build with LTO takes more than 15 minutes on the
    # Windows runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: app-v1
      - run: cargo fmt -p cww-app --check
      - run: mbx clippy -p cww-app --all-targets --locked -- -D warnings
      - run: mbx clippy -p cww-app --features demo --all-targets --locked -- -D warnings
      - run: mbx test -p cww-app --locked --no-run
      - run: mbx test -p cww-app --locked
        timeout-minutes: 5
      # Built by cargo itself, like the published binaries, since these are
      # downloadable.
      - run: cargo build -p cww-app -p cww --release --locked

      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        run: |
          packaging/macos/bundle.sh target/release/cww-app target/release/cww \
            "dist/Chat with Work Local Agent.app" "$(cargo pkgid -p cww-app | sed 's/.*[#@]//')"
          ditto -c -k --keepParent "dist/Chat with Work Local Agent.app" dist/cww-app-macos.zip
          rm -rf "dist/Chat with Work Local Agent.app"
      - name: Collect the Linux binary and desktop entry
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/cww-app-linux
          cp target/release/cww-app packaging/linux/cww-app.desktop dist/cww-app-linux/
          # Named as the desktop entry's Icon=cww-app asks.
          cp app/assets/mark.svg dist/cww-app-linux/cww-app.svg
      - name: Collect the Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p dist && cp target/release/cww-app.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: cww-app-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Every crate, the desktop app's dependencies included; by default
          # only the root package's are checked.
          arguments: --workspace --all-features

  nix:
    name: Nix package (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Build package
        run: nix build .#default -L
      - run: ./result/bin/cww --version
