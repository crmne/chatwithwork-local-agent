# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
# The platforms cww ships for. Windows comes later.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Every license here is compatible with shipping cww as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots: Mozilla's CA list.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# ring's license file combines ISC, MIT and OpenSSL-derived terms.
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Native TLS and OpenSSL are never allowed: TLS is rustls with ring only.
deny = [
    { crate = "openssl", reason = "TLS must be rustls" },
    { crate = "openssl-sys", reason = "TLS must be rustls" },
    { crate = "native-tls", reason = "TLS must be rustls" },
    { crate = "aws-lc-sys", reason = "keep the build pure Rust plus ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
