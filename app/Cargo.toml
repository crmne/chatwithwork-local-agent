[package]
name = "cww-app"
version = "0.3.1"
edition = "2024"
# fastframe needs 1.98 (eframe 0.36 alone needs 1.95); the daemon itself
# builds with 1.90.
rust-version = "1.98"
description = "Chat with Work Local Agent: the menu bar app and settings window for the cww daemon"
license = "MIT OR Apache-2.0"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/chatwithwork-local-agent"
homepage = "https://chatwithwork.com"
readme = "../README.md"
publish = false

[[bin]]
name = "cww-app"
path = "src/main.rs"

[dependencies]
# The daemon's paths and control client, so the app finds its socket or pipe
# exactly where it listens and checks the pipe's owner on Windows. Only the
# control client and paths are linked in.
cww = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# The settings window. glow keeps the binary and the dependency tree small;
# a settings window needs no wgpu. AccessKit connects the controls to the
# platform screen readers.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
# The event loop the tray and the window share. eframe already compiles it.
winit = { version = "0.30", default-features = false }
# PNG decoding for the icons and encoding for --screenshot. eframe already
# compiles it with png.
image = { version = "0.25", default-features = false, features = ["png"] }
# The native folder picker: NSOpenPanel, IFileDialog, or the XDG portal.
# The dialog is built on the main thread and awaited on another with
# pollster, so the window keeps drawing and AppKit runs no nested loop.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
pollster = "0.4"
# The Documents folder of each platform (XDG user dirs, Known Folders).
directories = "6"
# Opens the config file and the log in their default apps.
open = "5"
# Local times in the activity log.
jiff = "0.2"
# Every fastframe crate comes from the same release, so they share one
# version. Move them together.
# Follows the desktop's font rendering (hinting, sub-pixel positions, and
# linear coverage on Linux), shared with the other fastframe apps.
fastframe-text = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Reveals a switch between light and dark from the middle of the window
# outwards, as Omarchy does.
fastframe-theme = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Draws color emoji in the platform's own style in every egui text, such
# as folder and file names.
fastframe-emoji = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The native macOS traffic lights and title-bar double-click preference.
fastframe-macos = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# One running copy per user: a second launch asks it to open its window.
fastframe-instance = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Scrolling that feels like the platform's: a wheel notch scrolls as far
# as in other apps, and on Linux touchpad gestures keep their speed and
# glide on after the fingers lift.
fastframe-scroll = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The tray item with the platform's own menu: a StatusNotifierItem on
# Linux (Waybar, KDE, GNOME with the AppIndicator extension), the
# notification area on Windows, and the menu bar on macOS.
fastframe-tray = { version = "0.4.1", git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Maps the system UI font instead of reading it: San Francisco is 8 MB.
memmap2 = "0.9"
# Waits for the daemon's socket to appear instead of polling for it.
notify = "8.2"
# The web's logos and file-type icons, fetched from the paired server as
# SVG (most file types and the big services) or PNG (the rest of the
# connectors), drawn once into textures. No text, fonts or embedded rasters:
# the web's images use none.
resvg = { version = "0.48", default-features = false }
# Answers in chats are Markdown (CommonMark with GitHub's tables and
# strikethrough), parsed here and drawn as the web app draws them.
pulldown-cmark = { version = "0.13", default-features = false }
# Only for --demo, whose stand-in daemon uses the real listener.
tokio = { version = "1.53", features = ["rt-multi-thread"], optional = true }
tokio-util = { version = "0.7", features = ["io-util"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly. zbus runs AccessKit's screen reader bridge on this
# pool, and in blocking 1.7.0 an idle pool thread never exits: its exit test
# needs the pool to be over its 500-thread limit as well as idle, so it
# wakes every 500 ms for the life of the process once the window has been
# opened. 1.6.2 lets idle threads exit. Drop this once a fixed release is out.
blocking = "=1.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSColor", "NSColorSpace", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(windows)'.build-dependencies]
# The icon and version information Windows shows for the executable.
winresource = "0.1"

[features]
# --demo: runs against a built-in fake daemon with sample folders and
# activity, for screenshots and trying the window. Never in release builds.
demo = ["dep:tokio", "dep:tokio-util"]

[dev-dependencies]
# Drives the window through its accessibility tree. The chat page's tests
# also render it offscreen with wgpu (a software rasterizer where there is
# one) and save PNG snapshots.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
tempfile = "3.27"

# The stand-in daemon, and a test that runs the real one.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["io-util"] }

